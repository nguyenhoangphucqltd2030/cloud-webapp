<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý công việc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand">Xin chào, <b>{{ username }}</b></span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Đăng xuất</a>
    </nav>
    <div class="container mt-4" style="max-width: 800px;">
        <div class="card p-3 mb-4 shadow-sm">
            <h5>Thêm công việc mới</h5>
            <form action="/add" method="POST" class="d-flex gap-2">
                <input type="text" name="title" class="form-control" placeholder="Nhập nội dung công việc..." required>
                <button type="submit" class="btn btn-primary">Thêm</button>
            </form>
        </div>

        <div class="card p-3 shadow-sm">
            <h5>Danh sách công việc</h5>
            <table class="table table-bordered align-middle mt-2">
                <thead class="table-secondary">
                    <tr>
                        <th>ID</th>
                        <th>Nội dung & Trạng thái (Sửa trực tiếp)</th>
                        <th style="width: 150px;">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    {% for task in tasks %}
                    <tr>
                        <td>{{ task.id }}</td>
                        <td>
                            <form action="/edit/{{ task.id }}" method="POST" class="d-flex gap-2">
                                <input type="text" name="title" value="{{ task.title }}" class="form-control form-control-sm" required>
                                <select name="status" class="form-select form-select-sm" style="width: 140px;">
                                    <option value="Đang làm" {% if task.status == 'Đang làm' %}selected{% endif %}>Đang làm</option>
                                    <option value="Hoàn thành" {% if task.status == 'Hoàn thành' %}selected{% endif %}>Hoàn thành</option>
                                </select>
                                <button type="submit" class="btn btn-warning btn-sm">Lưu</button>
                            </form>
                        </td>
                        <td>
                            <a href="/delete/{{ task.id }}" class="btn btn-danger btn-sm w-100" onclick="return confirm('Xóa mục này?')">Xóa</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
